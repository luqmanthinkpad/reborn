<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10253f">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net"> 
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/frontend-new.js">
    <!-- NEWSGO_EDGE_SEO_START: Cloudflare may replace values inside this block. -->
    <title>News &mdash; Latest News</title>
    <meta name="description" content="Read the latest news summaries.">
    <link rel="canonical" href="/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="News">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="News &mdash; Latest News">
    <meta property="og:description" content="Read the latest news summaries.">
    <meta property="og:url" content="/">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="News &mdash; Latest News">
    <meta name="twitter:description" content="Read the latest news summaries.">
    <meta name="twitter:image" content="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/favicon.ico">
    <script id="newsgo-jsonld" type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"News","url":"/"}</script>
    <!-- NEWSGO_EDGE_SEO_END -->

    <!-- Empty means the current origin. The edge may set the canonical public origin. -->
    <meta name="newsgo-site-url" content="">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/favicon.ico" sizes="any">
    <link rel="alternate" type="application/rss+xml" href="/rss.xml" title="News RSS">
    <style>
      :root{color:#222;background:#f7f7f7;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}a{color:inherit}.site-header{min-height:4.75rem;border-bottom:1px solid #e7e7e7;background:#fff;color:#172335}.shell{width:min(70rem,calc(100% - 2rem));margin-inline:auto}main{min-height:70vh;padding-block:2rem}.loading-card{min-height:16rem;background:#fff;border-radius:.25rem}
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/newsgo-inject.css" media="print" onload="this.media='all'">
    <script src="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/newsgo-inject.js" defer></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/luqmanthinkpad/reborn/frontend-new.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" data-route aria-label="Return to the homepage">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>News</span>
        </a>

        <div class="database-control">
          <label for="database-select">Category</label>
          <select id="database-select" disabled>
            <option>Loading source&hellip;</option>
          </select>
        </div>
      </div>
    </header>

    <main id="main-content" class="shell" tabindex="-1" data-newsgo-inject-root data-newsgo-api-origin="https://powerhouse.my.id">
      <div data-newsgo-ad-slot="header"></div>
      <div data-newsgo-ad-slot="mini"></div>
      <div data-newsgo-ad-slot="sidebar"></div>
      <div id="app" aria-busy="true">
        <section class="loading-card" aria-label="Loading content">
          <span class="spinner" aria-hidden="true"></span>
          <p>Loading news&hellip;</p>
        </section>
      </div>
      <p id="route-status" class="sr-only" role="status" aria-live="polite"></p>
      <section class="widget" style="margin-top:2rem">
        <div data-newsgo-ad-slot="footer"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p id="copyright"></p>
      </div>
    </footer>
  </body>
</html>
